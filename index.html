<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="retroUI - A collection of retro-themed UI components built with Tailwind CSS for modern web applications. Pixel-perfect, nostalgic designs ready to copy and paste." />
    <meta name="theme-color" content="#ede7d6" />

    <!-- Favicons (TODO: generate PNGs from favicon2.png and drop into public/) -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Canonical -->
    <link rel="canonical" href="https://retro-ui.basecase.site/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="retroUI" />
    <meta property="og:url" content="https://retro-ui.basecase.site/" />
    <meta property="og:title" content="retroUI | Retro-Themed UI Components" />
    <meta property="og:description" content="Pixel-perfect, nostalgic UI components for modern web applications. Built with Tailwind CSS." />
    <!-- Generated at build time via `npm run og:generate` (scripts/generate-og-image.js) -->
    <meta property="og:image" content="https://retro-ui.basecase.site/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="retroUI | Retro-Themed UI Components" />

    <meta name="twitter:image" content="https://retro-ui.basecase.site/og-image.png" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
